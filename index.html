<!doctype html>
<html lang="en">
<head>

<style>
  :root {
    --paper: #ffffff;
    --ink: #0d0d0d;
    --serif: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px 40px;
  }

  main { width: 100%; max-width: 960px; }

  .mark {
    font-family: "Bodoni Moda", var(--serif);
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: clamp(46px, 10.5vw, 132px);
    line-height: 1;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-transform: lowercase;
  }

  .mark img { display: block; width: clamp(240px, 62vw, 640px); height: auto; margin: 0 auto; }

  .line {
    margin: clamp(18px, 3vw, 34px) auto 0;
    max-width: 36ch;
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(15px, 2.1vw, 21px);
    line-height: 1.5;
    letter-spacing: 0.06em;
  }

  .tag {
    margin-top: clamp(22px, 3vw, 34px);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
  }

  form {
    margin: clamp(30px, 4vw, 48px) auto 0;
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--ink);
  }
  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: 14px 0;
    border: 0;
    background: transparent;
    font-family: var(--sans);
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--ink);
    outline: none;
    border-radius: 0;
    text-align: left;
  }
  input[type="email"]::placeholder { color: rgba(13, 13, 13, 0.4); }
  button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    padding: 14px 0 14px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { opacity: 0.6; }
  button:disabled { opacity: 0.4; cursor: default; }
  .hp { position: absolute; left: -9999px; }

  #msg {
    margin-top: 16px;
    min-height: 1.5em;
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
  }
  .note {
    margin: 2px auto 0;
    max-width: 420px;
    font-size: 10.5px;
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.6;
    color: rgba(13, 13, 13, 0.5);
  }

  footer {
    margin-top: clamp(40px, 7vw, 80px);
    font-size: 10.5px;
    font-weight: 300;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
  }
  footer { display: flex; justify-content: center; align-items: center; gap: 30px; text-indent: 0; }
  footer a { color: inherit; text-decoration: none; display: inline-flex; }
  footer a:hover { opacity: 0.6; }
  footer svg { display: block; }

  @media (max-width: 480px) {
    .tag { font-size: 10px; letter-spacing: 0.28em; text-indent: 0.28em; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark"><img src="logo.png" width="970" height="182" alt="ALKALINE"></h1>
    <p class="line">Be the first to know when we launch Collection 001</p>
    <p class="tag">Drop 001 &nbsp;&middot;&nbsp; Coming Soon</p>

    <form id="waitlist" autocomplete="on">
      <input type="email" id="email" name="email" placeholder="Your email" required aria-label="email address">
      <input type="text" id="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="btn">Join</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="note">By joining, you agree to get emails from Alkaline about the launch. Unsubscribe anytime.</p>

    <footer>
      <a href="https://instagram.com/alkaline.la" target="_blank" rel="noopener" aria-label="Alkaline on Instagram (@alkaline.la)" title="Instagram"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://www.tiktok.com/@alkalinela" target="_blank" rel="noopener" aria-label="Alkaline on TikTok (@alkalinela)" title="TikTok"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></a>
    </footer>
  </main>

<script>
  // Klaviyo public key (Site ID) and Waitlist list ID.
  var KLAVIYO_PUBLIC_KEY = "VcihA4";
  var KLAVIYO_LIST_ID = "UgFdBm";

  var form = document.getElementById("waitlist");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("btn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (document.getElementById("company").value) return; // spam trap
    var email = document.getElementById("email").value.trim();
    if (!email) return;

    btn.disabled = true;
    msg.textContent = "";

    fetch("https://a.klaviyo.com/client/subscriptions/?company_id=" + encodeURIComponent(KLAVIYO_PUBLIC_KEY), {
      method: "POST",
      headers: { "Content-Type": "application/json", "revision": "2024-10-15" },
      body: JSON.stringify({
        data: {
          type: "subscription",
          attributes: {
            custom_source: "alkaline waitlist page",
            profile: { data: { type: "profile", attributes: { email: email } } }
          },
          relationships: { list: { data: { type: "list", id: KLAVIYO_LIST_ID } } }
        }
      })
    }).then(function (res) {
      if (res.ok) {
        form.style.display = "none";
        msg.textContent = "You're on the list. We'll be in touch.";
      } else {
        throw new Error("bad status " + res.status);
      }
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = "Something went wrong. Try again?";
    });
  });
</script>
</body>
</html>
