<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alkaline | coming soon</title>
<meta name="description" content="Made for the whole day, not just one part of it. The Perfect pH Tank. Coming soon.">
<meta property="og:title" content="alkaline | coming soon">
<meta property="og:description" content="Made for the whole day, not just one part of it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --ink: #0d0d0d;
    --serif: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px 40px;
  }

  main { width: 100%; max-width: 960px; }

  .mark {
    font-family: "Bodoni Moda", var(--serif);
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: clamp(46px, 10.5vw, 132px);
    line-height: 1;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-transform: lowercase;
  }

  .line {
    margin: clamp(18px, 3vw, 34px) auto 0;
    max-width: 22ch;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(22px, 3.4vw, 40px);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .tag {
    margin-top: clamp(22px, 3vw, 34px);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
  }

  form {
    margin: clamp(30px, 4vw, 48px) auto 0;
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--ink);
  }
  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: 14px 0;
    border: 0;
    background: transparent;
    font-family: var(--sans);
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--ink);
    outline: none;
    border-radius: 0;
    text-align: left;
  }
  input[type="email"]::placeholder { color: rgba(13, 13, 13, 0.4); }
  button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    padding: 14px 0 14px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { opacity: 0.6; }
  button:disabled { opacity: 0.4; cursor: default; }
  .hp { position: absolute; left: -9999px; }

  #msg {
    margin-top: 16px;
    min-height: 1.5em;
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
  }
  .note {
    margin: 2px auto 0;
    max-width: 420px;
    font-size: 10.5px;
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.6;
    color: rgba(13, 13, 13, 0.5);
  }

  footer {
    margin-top: clamp(40px, 7vw, 80px);
    font-size: 10.5px;
    font-weight: 300;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { opacity: 0.6; }

  @media (max-width: 480px) {
    .tag { font-size: 10px; letter-spacing: 0.28em; text-indent: 0.28em; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark">alkaline</h1>
    <p class="line">Made for the whole day, not just one part of it.</p>
    <p class="tag">The Perfect pH Tank &nbsp;&middot;&nbsp; Coming Soon</p>

    <form id="waitlist" autocomplete="on">
      <input type="email" id="email" name="email" placeholder="Your email" required aria-label="email address">
      <input type="text" id="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="btn">Join</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="note">By joining, you agree to get emails from alkaline about the launch. Unsubscribe anytime.</p>

    <footer><a href="https://instagram.com/alkalinela" target="_blank" rel="noopener">@alkalinela</a></footer>
  </main>

<script>
  // Klaviyo public key (Site ID) and Waitlist list ID.
  var KLAVIYO_PUBLIC_KEY = "VcihA4";
  var KLAVIYO_LIST_ID = "UgFdBm";

  var form = document.getElementById("waitlist");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("btn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (document.getElementById("company").value) return; // spam trap
    var email = document.getElementById("email").value.trim();
    if (!email) return;

    btn.disabled = true;
    msg.textContent = "";

    fetch("https://a.klaviyo.com/client/subscriptions/?company_id=" + encodeURIComponent(KLAVIYO_PUBLIC_KEY), {
      method: "POST",
      headers: { "Content-Type": "application/json", "revision": "2024-10-15" },
      body: JSON.stringify({
        data: {
          type: "subscription",
          attributes: {
            custom_source: "alkaline waitlist page",
            profile: { data: { type: "profile", attributes: { email: email } } }
          },
          relationships: { list: { data: { type: "list", id: KLAVIYO_LIST_ID } } }
        }
      })
    }).then(function (res) {
      if (res.ok) {
        form.style.display = "none";
        msg.textContent = "You're on the list. We'll be in touch.";
      } else {
        throw new Error("bad status " + res.status);
      }
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = "Something went wrong. Try again?";
    });
  });
</script>
</body>
</html>
